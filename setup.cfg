[metadata]
name = beyond-discovery-rsi
version = 0.1.0
description = Domain-neutral, evidence-gated coevolution research core
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    beyond-discovery = beyond_discovery.run:main
