[metadata]
name = beyond-discovery-rsi
version = 0.2.0
description = Domain-neutral, evidence-gated coevolution research core
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    beyond-discovery = beyond_discovery.run:main
    beyond-discovery-apps = beyond_discovery.benchmarks.apps.cli:main

[options.extras_require]
model-http =
    httpx[socks]>=0.28,<1
training =
    torch>=2.2
    transformers>=4.45,<5
    peft>=0.13,<1

[options.package_data]
beyond_discovery =
    benchmarks/apps/*.json
    benchmarks/apps/*.jsonl
    benchmarks/apps/vendor/*
    benchmarks/apps/container/*
